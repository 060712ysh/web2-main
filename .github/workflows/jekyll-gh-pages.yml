name: Deploy Vue Vite Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # 改為 true，重複推送時會自動取消舊的、跑新的，省時間

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build # ⭐ 這裡會幫你真正執行 Vite 打包，產生 dist 資料夾

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # ⭐ 告訴 GitHub 要上傳打包好的 dist 資料夾，而不是原始碼

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4